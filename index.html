<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Log API & Veicoli</title>

  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Flatpickr -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="https://npmcdn.com/flatpickr/dist/themes/dark.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://npmcdn.com/flatpickr/dist/l10n/it.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8 font-sans">

  <div class="max-w-7xl mx-auto space-y-6">
    
    <!-- Intestazione -->
    <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-800 pb-5">
      <div>
        <h1 class="text-2xl font-bold tracking-tight text-white flex items-center gap-2">
          <i data-lucide="activity" class="text-blue-500"></i>
          Monitor Log API & Flotta
        </h1>
        <p class="text-sm text-slate-400">Tabella di riferimento: <code class="text-blue-400">api_vehicle_logs</code></p>
      </div>

      <div class="flex items-center gap-3">
        <span id="sync-status" class="text-xs text-slate-400 flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          Connesso
        </span>
        <button id="btn-refresh" class="bg-blue-600 hover:bg-blue-500 transition px-3.5 py-1.5 rounded-lg text-sm font-medium flex items-center gap-1.5 shadow-sm">
          <i data-lucide="refresh-cw" class="w-4 h-4"></i>
          Aggiorna
        </button>
      </div>
    </header>

    <!-- Statistiche Rapide -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="bg-slate-800/60 border border-slate-700/60 rounded-xl p-4">
        <p class="text-xs text-slate-400 font-medium">Totale Record Letti</p>
        <p id="stat-total" class="text-2xl font-bold mt-1 text-white">0</p>
      </div>
      <div class="bg-slate-800/60 border border-slate-700/60 rounded-xl p-4">
        <p class="text-xs text-slate-400 font-medium">Scadenza 1 Giorno</p>
        <p id="stat-warning-1d" class="text-2xl font-bold mt-1 text-red-400">0</p>
      </div>
      <div class="bg-slate-800/60 border border-slate-700/60 rounded-xl p-4">
        <p class="text-xs text-slate-400 font-medium">Modalità Test</p>
        <p id="stat-test" class="text-2xl font-bold mt-1 text-sky-400">0</p>
      </div>
      <div class="bg-slate-800/60 border border-slate-700/60 rounded-xl p-4">
        <p class="text-xs text-slate-400 font-medium">Aggiornamenti Riusciti</p>
        <p id="stat-success" class="text-2xl font-bold mt-1 text-emerald-400">0</p>
      </div>
    </div>

    <!-- Barra Filtri Principale -->
    <div class="bg-slate-800/40 border border-slate-700/60 rounded-xl p-4 space-y-4">
      <div class="flex flex-wrap gap-4 items-center">
        <div class="flex-1 min-w-[200px]">
          <label class="block text-xs font-medium text-slate-400 mb-1">Cerca nel messaggio</label>
          <input type="text" id="filter-search" placeholder="Cerca testo..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:border-blue-500">
        </div>

        <!-- Calendario Flatpickr -->
        <div class="w-52">
          <div class="flex items-center justify-between mb-1">
            <label class="block text-xs font-medium text-slate-400">Calendario</label>
            <button id="btn-clear-date" type="button" class="text-[10px] text-blue-400 hover:underline">Azzera</button>
          </div>
          <div class="relative flex items-center">
            <input 
              type="text" 
              id="filter-calendar" 
              placeholder="Seleziona data..." 
              readonly
              class="w-full bg-slate-900 border border-slate-700 rounded-lg pl-9 pr-3 py-1.5 text-sm text-slate-200 cursor-pointer focus:outline-none focus:border-blue-500"
            >
            <i data-lucide="calendar" class="w-4 h-4 text-slate-400 absolute left-2.5 pointer-events-none"></i>
          </div>
        </div>

        <div class="w-32">
          <label class="block text-xs font-medium text-slate-400 mb-1">Livello</label>
          <select id="filter-level" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 text-sm focus:outline-none focus:border-blue-500">
            <option value="ALL">Tutti</option>
            <option value="INFO">INFO</option>
            <option value="WARNING">WARNING</option>
            <option value="ERROR">ERROR</option>
          </select>
        </div>

        <div class="w-28">
          <label class="block text-xs font-medium text-slate-400 mb-1">Limite</label>
          <select id="filter-limit" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 text-sm focus:outline-none focus:border-blue-500">
            <option value="50">50</option>
            <option value="100" selected>100</option>
            <option value="200">200</option>
            <option value="500">500</option>
          </select>
        </div>
      </div>

      <!-- Filtri Stato / Tipo Evento con Checkbox -->
      <div class="border-t border-slate-700/50 pt-3">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Filtra per Tipo Evento / Stato:</span>
          <div class="flex gap-2">
            <button id="btn-check-all" type="button" class="text-[11px] text-blue-400 hover:underline">Tutti</button>
            <span class="text-slate-600 text-xs">|</span>
            <button id="btn-uncheck-all" type="button" class="text-[11px] text-blue-400 hover:underline">Nessuno</button>
            <span class="text-slate-600 text-xs">|</span>
            <button id="btn-reset-default" type="button" class="text-[11px] text-amber-400 hover:underline">Ripristina Default</button>
          </div>
        </div>

        <div class="flex flex-wrap gap-2 text-xs font-sans">
          <!-- Default Checked: EXPIRY_WARNING_1D -->
          <label class="inline-flex items-center gap-1.5 bg-slate-900 border border-slate-700 hover:border-red-600/70 px-2.5 py-1.5 rounded-lg cursor-pointer transition select-none">
            <input type="checkbox" value="EXPIRY_WARNING_1D" checked class="status-checkbox rounded bg-slate-800 border-slate-600 text-red-500 focus:ring-0">
            <span class="text-red-400 font-semibold">EXPIRY_WARNING_1D</span>
          </label>

          <!-- Default Checked: EXPIRY_TRIGGER -->
          <label class="inline-flex items-center gap-1.5 bg-slate-900 border border-slate-700 hover:border-amber-500/70 px-2.5 py-1.5 rounded-lg cursor-pointer transition select-none">
            <input type="checkbox" value="EXPIRY_TRIGGER" checked class="status-checkbox rounded bg-slate-800 border-slate-600 text-amber-500 focus:ring-0">
            <span class="text-amber-300">Expiry Reached</span>
          </label>

          <!-- Default Checked: STATE_UPDATE_SUCCESS -->
          <label class="inline-flex items-center gap-1.5 bg-slate-900 border border-slate-700 hover:border-emerald-500/70 px-2.5 py-1.5 rounded-lg cursor-pointer transition select-none">
            <input type="checkbox" value="STATE_UPDATE_SUCCESS" checked class="status-checkbox rounded bg-slate-800 border-slate-600 text-emerald-500 focus:ring-0">
            <span class="text-emerald-400">STATE_UPDATE_SUCCESS</span>
          </label>

          <!-- Altri stati deselezionati di default -->
          <label class="inline-flex items-center gap-1.5 bg-slate-900 border border-slate-700 hover:border-slate-500 px-2.5 py-1.5 rounded-lg cursor-pointer transition select-none">
            <input type="checkbox" value="SKIPPED_NO_ACTION" class="status-checkbox rounded bg-slate-800 border-slate-600 text-slate-400 focus:ring-0">
            <span class="text-slate-300">SKIPPED_NO_ACTION</span>
          </label>

          <label class="inline-flex items-center gap-1.5 bg-slate-900 border border-slate-700 hover:border-purple-500/70 px-2.5 py-1.5 rounded-lg cursor-pointer transition select-none">
            <input type="checkbox" value="REALIGNMENT_REQUIRED" class="status-checkbox rounded bg-slate-800 border-slate-600 text-purple-500 focus:ring-0">
            <span class="text-purple-300">REALIGNMENT_REQUIRED</span>
          </label>

          <label class="inline-flex items-center gap-1.5 bg-slate-900 border border-slate-700 hover:border-slate-500 px-2.5 py-1.5 rounded-lg cursor-pointer transition select-none">
            <input type="checkbox" value="JOB_START" class="status-checkbox rounded bg-slate-800 border-slate-600 text-blue-500 focus:ring-0">
            <span class="text-slate-300">JOB_START</span>
          </label>

          <label class="inline-flex items-center gap-1.5 bg-slate-900 border border-slate-700 hover:border-slate-500 px-2.5 py-1.5 rounded-lg cursor-pointer transition select-none">
            <input type="checkbox" value="JOB_END" class="status-checkbox rounded bg-slate-800 border-slate-600 text-blue-500 focus:ring-0">
            <span class="text-slate-300">JOB_END</span>
          </label>

          <label class="inline-flex items-center gap-1.5 bg-slate-900 border border-slate-700 hover:border-slate-500 px-2.5 py-1.5 rounded-lg cursor-pointer transition select-none">
            <input type="checkbox" value="OTHER" class="status-checkbox rounded bg-slate-800 border-slate-600 text-slate-500 focus:ring-0">
            <span class="text-slate-400">Altri (SYSTEM/VEHICLE_LOG)</span>
          </label>
        </div>
      </div>
    </div>

    <!-- Tabella Log -->
    <div class="bg-slate-800/40 border border-slate-700/60 rounded-xl overflow-hidden shadow-lg">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm border-collapse">
          <thead class="bg-slate-950 text-slate-400 uppercase text-[11px] font-semibold tracking-wider border-b border-slate-800">
            <tr>
              <th class="py-3 px-4">Timestamp</th>
              <th class="py-3 px-4">Livello</th>
              <th class="py-3 px-4">Tipo Evento</th>
              <th class="py-3 px-4">Veicolo / ID</th>
              <th class="py-3 px-4">Messaggio</th>
            </tr>
          </thead>
          <tbody id="logs-tbody" class="divide-y divide-slate-800/60 font-mono text-xs">
            <tr>
              <td colspan="5" class="text-center py-8 text-slate-500">Caricamento log in corso...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = "https://vcekmiomodmgwashgegx.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZjZWttaW9tb2RtZ3dhc2hnZWd4Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4OTcyMTIzOSwiZXhwIjoyMTA1Mjk3MjM5fQ.cBIBLXTQfBiGCYLap4EHHA3fUSCIfyeIzvXdKE6nCkM";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let logsCache = [];
    let selectedCalendarDate = "";

    const calendarPicker = flatpickr("#filter-calendar", {
      locale: "it",
      dateFormat: "Y-m-d",
      altInput: true,
      altFormat: "j F Y",
      allowInput: false,
      onChange: function(selectedDates, dateStr) {
        selectedCalendarDate = dateStr;
        applyClientFilters();
      }
    });

    function isOneDayRecord(row) {
      if (row.event_type === "EXPIRY_WARNING_1D") return true;
      const msg = row.message || "";
      const textMatch = /\b1\s*(gg|giorno|day)\b/i.test(msg);
      const metaMatch = row.raw_metadata && (row.raw_metadata.days_elapsed === 1 || row.raw_metadata.days_elapsed === "1");
      return Boolean(textMatch || metaMatch);
    }

    function isTestRecord(row) {
      const msg = (row.message || "").toLowerCase();
      const model = (row.vehicle_model || "").toLowerCase();
      const metaStr = row.raw_metadata ? JSON.stringify(row.raw_metadata).toLowerCase() : "";

      const testRegex = /\b(test|dry-run|dryrun|simulazione|mock)\b/i;
      return testRegex.test(msg) || testRegex.test(model) || testRegex.test(metaStr);
    }

    function formatDate(rawStr) {
      if (!rawStr) return "-";
      const clean = rawStr.replace("T", " ").split("+")[0].split(".")[0];
      const parts = clean.split(" ");
      if (parts.length < 2) return rawStr;

      const [year, month, day] = parts[0].split("-");
      const time = parts[1];

      if (!year || !month || !day) return rawStr;
      return `${day}/${month}/${year} ${time}`;
    }

    function extractDateString(rawStr) {
      if (!rawStr) return "";
      return rawStr.substring(0, 10);
    }

    function renderBadgeLevel(level) {
      const colors = {
        INFO: "bg-blue-950 text-blue-400 border-blue-800",
        WARNING: "bg-amber-950 text-amber-400 border-amber-800",
        ERROR: "bg-rose-950 text-rose-400 border-rose-800",
        CRITICAL: "bg-red-950 text-red-300 border-red-700"
      };
      const c = colors[level] || "bg-slate-800 text-slate-300 border-slate-700";
      return `<span class="px-2 py-0.5 rounded border text-[10px] font-bold ${c}">${level}</span>`;
    }

    function renderBadgeEvent(evt, isWarning1D) {
      if (isWarning1D || evt === "EXPIRY_WARNING_1D") {
        return `<span class="px-2 py-0.5 rounded border text-[10px] font-medium font-sans bg-red-950/60 text-red-400 border-red-800/80">EXPIRY_WARNING_1D</span>`;
      }
      if (evt === "EXPIRY_TRIGGER") {
        return `<span class="px-2 py-0.5 rounded-full border text-[10px] font-sans bg-amber-500/10 text-amber-300 border-amber-500/20">Expiry Reached</span>`;
      }

      const colors = {
        STATE_UPDATE_SUCCESS: "bg-emerald-500/10 text-emerald-300 border-emerald-500/20",
        SKIPPED_NO_ACTION: "bg-slate-700/30 text-slate-400 border-slate-600/30",
        REALIGNMENT_REQUIRED: "bg-purple-500/10 text-purple-300 border-purple-500/20"
      };
      const c = colors[evt] || "bg-slate-800 text-slate-400 border-slate-700";
      return `<span class="px-2 py-0.5 rounded-full border text-[10px] font-sans ${c}">${evt}</span>`;
    }

    async function fetchLogs() {
      const limit = parseInt(document.getElementById("filter-limit").value, 10);
      const statusEl = document.getElementById("sync-status");
      statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-500 animate-spin"></span> Caricamento...`;

      try {
        let query = supabaseClient
          .from("api_vehicle_logs")
          .select("*")
          .order("log_time", { ascending: false })
          .limit(limit);

        const { data, error } = await query;
        if (error) throw error;

        logsCache = data || [];
        updateStats();
        applyClientFilters();

        statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Aggiornato: ${new Date().toLocaleTimeString()}`;
      } catch (err) {
        console.error("Errore fetch:", err);
        statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-rose-500"></span> Errore sincronizzazione`;
      }
    }

    function updateStats() {
      document.getElementById("stat-total").innerText = logsCache.length;
      document.getElementById("stat-warning-1d").innerText = logsCache.filter(l => isOneDayRecord(l)).length;
      document.getElementById("stat-test").innerText = logsCache.filter(l => isTestRecord(l)).length;
      document.getElementById("stat-success").innerText = logsCache.filter(l => l.event_type === "STATE_UPDATE_SUCCESS").length;
    }

    function getSelectedEventTypes() {
      return Array.from(document.querySelectorAll(".status-checkbox:checked")).map(cb => cb.value);
    }

    function applyClientFilters() {
      const filterLevel = document.getElementById("filter-level").value;
      const selectedEvents = getSelectedEventTypes();
      const searchTerm = document.getElementById("filter-search").value.toLowerCase();

      const standardKnownTypes = [
        "EXPIRY_WARNING_1D", "EXPIRY_TRIGGER", "STATE_UPDATE_SUCCESS", 
        "SKIPPED_NO_ACTION", "REALIGNMENT_REQUIRED", "JOB_START", "JOB_END"
      ];

      const filtered = logsCache.filter(item => {
        // 1. Filtro Livello
        const matchesLevel = filterLevel === "ALL" || item.level === filterLevel;
        
        // 2. Filtro Evento basato su checkbox
        let actualType = item.event_type;
        if (isOneDayRecord(item)) {
          actualType = "EXPIRY_WARNING_1D";
        }

        let matchesEvent = false;
        if (selectedEvents.includes(actualType)) {
          matchesEvent = true;
        } else if (selectedEvents.includes("OTHER") && !standardKnownTypes.includes(actualType)) {
          matchesEvent = true;
        }

        // 3. Filtro Calendario
        const matchesDate = !selectedCalendarDate || (extractDateString(item.log_time) === selectedCalendarDate);

        // 4. Ricerca Testuale
        const matchesSearch = !searchTerm || 
          (item.message && item.message.toLowerCase().includes(searchTerm)) ||
          (item.vehicle_model && item.vehicle_model.toLowerCase().includes(searchTerm));

        return matchesLevel && matchesEvent && matchesDate && matchesSearch;
      });

      renderTable(filtered);
    }

    function renderTable(logs) {
      const tbody = document.getElementById("logs-tbody");
      if (logs.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center py-6 text-slate-500">Nessun log corrispondente ai filtri selezionati.</td></tr>`;
        return;
      }

      tbody.innerHTML = logs.map(row => {
        const isWarning1D = isOneDayRecord(row);
        const isTest = isTestRecord(row);

        const vehicle = row.vehicle_model ? 
          `<span class="text-slate-200 font-semibold">${row.vehicle_model}</span> ${row.vehicle_id ? `<span class="text-slate-500">#${row.vehicle_id}</span>` : ""}` : 
          `<span class="text-slate-600">-</span>`;

        let rowClass = "hover:bg-slate-800/40 transition";
        if (isTest) {
          rowClass = "bg-sky-950/20 border-l-2 border-l-sky-500/40 hover:bg-sky-900/30 transition";
        }

        const testTag = isTest 
          ? `<span class="inline-flex items-center px-1.5 py-0.2 rounded text-[9px] font-medium bg-sky-900/40 text-sky-300 border border-sky-700/40 mr-1.5">TEST</span>` 
          : "";

        return `
          <tr class="${rowClass}">
            <td class="py-2.5 px-4 whitespace-nowrap text-slate-400 font-mono">${formatDate(row.log_time)}</td>
            <td class="py-2.5 px-4 whitespace-nowrap">${renderBadgeLevel(row.level)}</td>
            <td class="py-2.5 px-4 whitespace-nowrap">${renderBadgeEvent(row.event_type, isWarning1D)}</td>
            <td class="py-2.5 px-4 whitespace-nowrap font-sans">${vehicle}</td>
            <td class="py-2.5 px-4 break-words font-sans text-slate-300">
              ${testTag}${row.message}
            </td>
          </tr>
        `;
      }).join("");
    }

    // Event Listener
    document.getElementById("btn-refresh").addEventListener("click", fetchLogs);
    document.getElementById("filter-search").addEventListener("input", applyClientFilters);
    document.getElementById("btn-clear-date").addEventListener("click", () => {
      calendarPicker.clear();
      selectedCalendarDate = "";
      applyClientFilters();
    });
    document.getElementById("filter-level").addEventListener("change", applyClientFilters);
    document.getElementById("filter-limit").addEventListener("change", fetchLogs);

    // Checkbox Events
    document.querySelectorAll(".status-checkbox").forEach(cb => {
      cb.addEventListener("change", applyClientFilters);
    });

    // Pulsanti rapidi per le checkbox
    document.getElementById("btn-check-all").addEventListener("click", () => {
      document.querySelectorAll(".status-checkbox").forEach(cb => cb.checked = true);
      applyClientFilters();
    });

    document.getElementById("btn-uncheck-all").addEventListener("click", () => {
      document.querySelectorAll(".status-checkbox").forEach(cb => cb.checked = false);
      applyClientFilters();
    });

    document.getElementById("btn-reset-default").addEventListener("click", () => {
      const defaults = ["EXPIRY_WARNING_1D", "EXPIRY_TRIGGER", "STATE_UPDATE_SUCCESS"];
      document.querySelectorAll(".status-checkbox").forEach(cb => {
        cb.checked = defaults.includes(cb.value);
      });
      applyClientFilters();
    });

    // Avvio
    lucide.createIcons();
    fetchLogs();
  </script>
</body>
</html>
