  <script>
    const SUPABASE_URL = "https://vcekmiomodmgwashgegx.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZjZWttaW9tb2RtZ3dhc2hnZWd4Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4OTcyMTIzOSwiZXhwIjoyMTA1Mjk3MjM5fQ.cBIBLXTQfBiGCYLap4EHHA3fUSCIfyeIzvXdKE6nCkM";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentView = "logs"; // "logs" oppure "vehicles"
    let logsCache = [];
    let vehiclesCache = [];
    let selectedCalendarDate = "";

    const calendarPicker = flatpickr("#filter-calendar", {
      locale: "it",
      dateFormat: "Y-m-d",
      altInput: true,
      altFormat: "j F Y",
      allowInput: false,
      onChange: function(selectedDates, dateStr) {
        selectedCalendarDate = dateStr;
        applyFilters();
      }
    });

    function setView(view) {
      currentView = view;
      const btnLogs = document.getElementById("btn-view-logs");
      const btnVehicles = document.getElementById("btn-view-vehicles");
      const activeTableName = document.getElementById("active-table-name");

      const containerCal = document.getElementById("container-calendar");
      const containerMode = document.getElementById("container-mode");
      const containerLevel = document.getElementById("container-level");
      const containerChannel = document.getElementById("container-channel");
      const containerEvents = document.getElementById("container-events-filter");

      if (view === "logs") {
        btnLogs.className = "px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition bg-blue-600 text-white shadow";
        btnVehicles.className = "px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition text-slate-400 hover:text-white";
        activeTableName.innerText = "api_vehicle_logs";

        containerCal.classList.remove("hidden");
        containerMode.classList.remove("hidden");
        containerLevel.classList.remove("hidden");
        containerChannel.classList.add("hidden");
        containerEvents.classList.remove("hidden");
      } else {
        btnVehicles.className = "px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition bg-blue-600 text-white shadow";
        btnLogs.className = "px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition text-slate-400 hover:text-white";
        activeTableName.innerText = "operazioni_veicoli";

        containerCal.classList.add("hidden");
        containerMode.classList.add("hidden");
        containerLevel.classList.add("hidden");
        containerChannel.classList.remove("hidden");
        containerEvents.classList.add("hidden");
      }

      fetchData();
    }

    function isOneDayRecord(row) {
      if (row.event_type === "EXPIRY_WARNING_1D") return true;
      const msg = row.message || "";
      const textMatch = /\btrigger\s+tra\s+1\s*(gg|giorno|day)\b/i.test(msg);
      const metaMatch = row.raw_metadata && (row.raw_metadata.days_elapsed === 1 || row.raw_metadata.days_elapsed === "1");
      return Boolean(textMatch || metaMatch);
    }

    function isTestRecord(row) {
      if (row.execution_mode === "TEST") return true;
      const msg = (row.message || "").toLowerCase();
      const model = (row.vehicle_model || "").toLowerCase();
      const metaStr = row.raw_metadata ? JSON.stringify(row.raw_metadata).toLowerCase() : "";
      const testRegex = /\b(test|dry-run|dryrun|simulazione|mock)\b/i;
      return testRegex.test(msg) || testRegex.test(model) || testRegex.test(metaStr);
    }

    function formatDate(rawStr) {
      if (!rawStr) return "-";
      const clean = rawStr.replace("T", " ").split("+")[0].split(".")[0];
      const parts = clean.split(" ");
      if (parts.length < 2) {
        const d = clean.split("-");
        if (d.length === 3) return `${d[2]}/${d[1]}/${d[0]}`;
        return rawStr;
      }
      const [year, month, day] = parts[0].split("-");
      const time = parts[1];
      if (!year || !month || !day) return rawStr;
      return `${day}/${month}/${year} ${time}`;
    }

    function extractDateString(rawStr) {
      if (!rawStr) return "";
      return rawStr.substring(0, 10);
    }

    function renderBadgeMode(mode) {
      const m = (mode || "UNKNOWN").toUpperCase();
      const badges = {
        ENABLED: "bg-red-950/80 text-red-300 border-red-800",
        DISABLED: "bg-blue-950/80 text-blue-300 border-blue-800",
        TEST: "bg-amber-950/80 text-amber-300 border-amber-800",
        UNKNOWN: "bg-slate-800 text-slate-400 border-slate-700"
      };
      const badgeStyle = badges[m] || badges.UNKNOWN;
      return `<span class="px-2 py-0.5 rounded border text-[10px] font-bold tracking-wider uppercase ${badgeStyle}">${m}</span>`;
    }

    function renderBadgeLevel(level) {
      const colors = {
        INFO: "bg-blue-950 text-blue-400 border-blue-800",
        WARNING: "bg-amber-950 text-amber-400 border-amber-800",
        ERROR: "bg-rose-950 text-rose-400 border-rose-800",
        CRITICAL: "bg-red-950 text-red-300 border-red-700"
      };
      const c = colors[level] || "bg-slate-800 text-slate-300 border-slate-700";
      return `<span class="px-2 py-0.5 rounded border text-[10px] font-bold ${c}">${level}</span>`;
    }

    function renderBadgeEvent(evt, isWarning1D) {
      if (isWarning1D || evt === "EXPIRY_WARNING_1D") {
        return `<span class="px-2 py-0.5 rounded border text-[10px] font-medium font-sans bg-red-950/60 text-red-400 border-red-800/80">EXPIRY_WARNING_1D</span>`;
      }
      if (evt === "EXPIRY_TRIGGER") {
        return `<span class="px-2 py-0.5 rounded-full border text-[10px] font-sans bg-amber-500/10 text-amber-300 border-amber-500/20">TERM ELAPSED</span>`;
      }
      const colors = {
        STATE_UPDATE_SUCCESS: "bg-emerald-500/10 text-emerald-300 border-emerald-500/20",
        SKIPPED_NO_ACTION: "bg-slate-700/30 text-slate-400 border-slate-600/30",
        REALIGNMENT_REQUIRED: "bg-purple-500/10 text-purple-300 border-purple-500/20"
      };
      const c = colors[evt] || "bg-slate-800 text-slate-400 border-slate-700";
      return `<span class="px-2 py-0.5 rounded-full border text-[10px] font-sans ${c}">${evt}</span>`;
    }

    function renderStatusPill(statusVal) {
      if (statusVal === 1) {
        return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20"><span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> Attivo</span>`;
      } else if (statusVal === 0) {
        return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-semibold bg-rose-500/10 text-rose-400 border border-rose-500/20"><span class="w-1.5 h-1.5 rounded-full bg-rose-400"></span> Spento</span>`;
      }
      return `<span class="text-slate-500 text-[10px]">-</span>`;
    }

    // Funzione globale per espandere/collassare il testo con clamp
    window.toggleExpandText = function(btn) {
      const container = btn.closest('.expandable-cell');
      if (!container) return;
      const textEl = container.querySelector('.expandable-text');
      const labelEl = container.querySelector('.toggle-label');
      const iconEl = container.querySelector('.toggle-icon');

      if (textEl.classList.contains('clamp-text')) {
        textEl.classList.remove('clamp-text');
        textEl.classList.add('expanded-text');
        if (labelEl) labelEl.textContent = 'Meno';
        if (iconEl) iconEl.style.transform = 'rotate(180deg)';
      } else {
        textEl.classList.remove('expanded-text');
        textEl.classList.add('clamp-text');
        if (labelEl) labelEl.textContent = 'Altro';
        if (iconEl) iconEl.style.transform = 'rotate(0deg)';
      }
    };

    async function fetchData() {
      const limit = parseInt(document.getElementById("filter-limit").value, 10);
      const statusEl = document.getElementById("sync-status");
      statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-500 animate-spin"></span> Caricamento...`;

      try {
        if (currentView === "logs") {
          let query = supabaseClient
            .from("api_vehicle_logs")
            .select("*")
            .order("log_time", { ascending: false })
            .limit(limit);

          const { data, error } = await query;
          if (error) throw error;
          logsCache = data || [];
        } else {
          let query = supabaseClient
            .from("operazioni_veicoli")
            .select("*")
            .order("data_acquisizione", { ascending: false })
            .limit(limit);

          const { data, error } = await query;
          if (error) throw error;
          vehiclesCache = data || [];
        }

        updateStats();
        applyFilters();

        statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Aggiornato: ${new Date().toLocaleTimeString()}`;
      } catch (err) {
        console.error("Errore fetch:", err);
        statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-rose-500"></span> Errore sync`;
      }
    }

    function updateStats() {
      if (currentView === "logs") {
        document.getElementById("stat-label-1").innerText = "Totale Record Letti";
        document.getElementById("stat-val-1").innerText = logsCache.length;

        document.getElementById("stat-label-2").innerText = "Scadenza 1 Giorno";
        document.getElementById("stat-val-2").innerText = logsCache.filter(l => isOneDayRecord(l)).length;

        document.getElementById("stat-label-3").innerText = "TERM ELAPSED";
        document.getElementById("stat-val-3").innerText = logsCache.filter(l => l.event_type === "EXPIRY_TRIGGER").length;

        document.getElementById("stat-label-4").innerText = "Aggiornamenti Riusciti";
        document.getElementById("stat-val-4").innerText = logsCache.filter(l => l.event_type === "STATE_UPDATE_SUCCESS").length;
      } else {
        document.getElementById("stat-label-1").innerText = "Totale Flotta Veicoli";
        document.getElementById("stat-val-1").innerText = vehiclesCache.length;

        document.getElementById("stat-label-2").innerText = "Subito Attivi";
        document.getElementById("stat-val-2").innerText = vehiclesCache.filter(v => v.status_subito === 1).length;

        document.getElementById("stat-label-3").innerText = "AutoScout Attivi";
        document.getElementById("stat-val-3").innerText = vehiclesCache.filter(v => v.status_autoscout === 1).length;

        document.getElementById("stat-label-4").innerText = "Disattivati (Subito/AS)";
        document.getElementById("stat-val-4").innerText = vehiclesCache.filter(v => v.status_subito === 0 || v.status_autoscout === 0).length;
      }
    }

    function getSelectedEventTypes() {
      return Array.from(document.querySelectorAll(".status-checkbox:checked")).map(cb => cb.value);
    }

    function applyFilters() {
      const searchTerm = document.getElementById("filter-search").value.toLowerCase();
      const counterEl = document.getElementById("records-counter");

      if (currentView === "logs") {
        const filterLevel = document.getElementById("filter-level").value;
        const filterMode = document.getElementById("filter-mode").value;
        const selectedEvents = getSelectedEventTypes();

        const standardKnownTypes = [
          "EXPIRY_WARNING_1D", "EXPIRY_TRIGGER", "STATE_UPDATE_SUCCESS", 
          "SKIPPED_NO_ACTION", "REALIGNMENT_REQUIRED", "JOB_START", "JOB_END"
        ];

        const filtered = logsCache.filter(item => {
          const matchesLevel = filterLevel === "ALL" || item.level === filterLevel;
          const currentMode = (item.execution_mode || "UNKNOWN").toUpperCase();
          const matchesMode = filterMode === "ALL" || currentMode === filterMode;

          let actualType = item.event_type;
          if (isOneDayRecord(item)) actualType = "EXPIRY_WARNING_1D";

          let matchesEvent = false;
          if (selectedEvents.includes(actualType)) {
            matchesEvent = true;
          } else if (selectedEvents.includes("OTHER") && !standardKnownTypes.includes(actualType)) {
            matchesEvent = true;
          }

          const matchesDate = !selectedCalendarDate || (extractDateString(item.log_time) === selectedCalendarDate);

          const matchesSearch = !searchTerm || 
            (item.message && item.message.toLowerCase().includes(searchTerm)) ||
            (item.vehicle_model && item.vehicle_model.toLowerCase().includes(searchTerm));

          return matchesLevel && matchesMode && matchesEvent && matchesDate && matchesSearch;
        });

        if (counterEl) counterEl.innerText = `Record mostrati: ${filtered.length} di ${logsCache.length}`;
        renderLogsTable(filtered);
      } else {
        const filterChannel = document.getElementById("filter-channel").value;

        const filtered = vehiclesCache.filter(item => {
          const matchesSearch = !searchTerm ||
            (item.descrizione && item.descrizione.toLowerCase().includes(searchTerm)) ||
            (item.id && String(item.id).toLowerCase().includes(searchTerm));

          const flag = (item.flag || "").toLowerCase();
          const matchesChannel = filterChannel === "ALL" || flag.includes(filterChannel);

          return matchesSearch && matchesChannel;
        });

        if (counterEl) counterEl.innerText = `Record mostrati: ${filtered.length} di ${vehiclesCache.length}`;
        renderVehiclesTable(filtered);
      }
    }

    function renderLogsTable(logs) {
      const thead = document.getElementById("table-thead");
      thead.innerHTML = `
        <tr>
          <th class="py-3 px-3 sm:px-4">Timestamp</th>
          <th class="py-3 px-3 sm:px-4">Modo</th>
          <th class="py-3 px-3 sm:px-4">Livello</th>
          <th class="py-3 px-3 sm:px-4">Tipo Evento</th>
          <th class="py-3 px-3 sm:px-4">Veicolo / ID</th>
          <th class="py-3 px-3 sm:px-4 min-w-[200px] max-w-[320px] sm:max-w-md">Messaggio</th>
        </tr>
      `;

      const tbody = document.getElementById("table-tbody");
      if (logs.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-6 text-slate-500">Nessun log trovato.</td></tr>`;
        return;
      }

      tbody.innerHTML = logs.map(row => {
        const isWarning1D = isOneDayRecord(row);
        const isTest = isTestRecord(row);

        const vehicle = row.vehicle_model ? 
          `<span class="text-slate-200 font-semibold">${row.vehicle_model}</span> ${row.vehicle_id ? `<span class="text-slate-500">#${row.vehicle_id}</span>` : ""}` : 
          `<span class="text-slate-600">-</span>`;

        let rowClass = "hover:bg-slate-800/40 transition";
        if (isTest) {
          rowClass = "bg-sky-950/20 border-l-2 border-l-sky-500/40 hover:bg-sky-900/30 transition";
        }

        const msg = row.message || "-";
        const isLongMsg = msg.length > 75;

        return `
          <tr class="${rowClass}">
            <td class="py-2.5 px-3 sm:px-4 whitespace-nowrap text-slate-400 font-mono text-[11px] sm:text-xs">${formatDate(row.log_time)}</td>
            <td class="py-2.5 px-3 sm:px-4 whitespace-nowrap">${renderBadgeMode(row.execution_mode)}</td>
            <td class="py-2.5 px-3 sm:px-4 whitespace-nowrap">${renderBadgeLevel(row.level)}</td>
            <td class="py-2.5 px-3 sm:px-4 whitespace-nowrap">${renderBadgeEvent(row.event_type, isWarning1D)}</td>
            <td class="py-2.5 px-3 sm:px-4 whitespace-nowrap font-sans text-xs">${vehicle}</td>
            <td class="py-2 px-3 sm:px-4 min-w-[200px] max-w-[280px] sm:max-w-md">
              <div class="expandable-cell text-slate-300 font-sans text-xs">
                <div class="expandable-text clamp-text leading-snug cursor-pointer select-text" onclick="toggleExpandText(this)">
                  ${msg}
                </div>
                ${isLongMsg ? `
                  <button type="button" onclick="toggleExpandText(this)" class="mt-1 inline-flex items-center gap-1 text-[11px] font-semibold text-blue-400 hover:text-blue-300 transition focus:outline-none">
                    <span class="toggle-label">Altro</span>
                    <i data-lucide="chevron-down" class="toggle-icon w-3 h-3 transition-transform"></i>
                  </button>
                ` : ''}
              </div>
            </td>
          </tr>
        `;
      }).join("");

      lucide.createIcons();
    }

    function renderVehiclesTable(vehicles) {
      const thead = document.getElementById("table-thead");
      thead.innerHTML = `
        <tr>
          <th class="py-3 px-3 sm:px-4">ID</th>
          <th class="py-3 px-3 sm:px-4 min-w-[180px] max-w-[260px] sm:max-w-sm">Modello / Veicolo</th>
          <th class="py-3 px-3 sm:px-4">Canale (Flag)</th>
          <th class="py-3 px-3 sm:px-4">Stato Subito</th>
          <th class="py-3 px-3 sm:px-4">Pubbl. Subito</th>
          <th class="py-3 px-3 sm:px-4">Disattivazione Subito</th>
          <th class="py-3 px-3 sm:px-4">Stato AutoScout</th>
          <th class="py-3 px-3 sm:px-4">Pubbl. AutoScout</th>
          <th class="py-3 px-3 sm:px-4">Disattivazione AutoScout</th>
        </tr>
      `;

      const tbody = document.getElementById("table-tbody");
      if (vehicles.length === 0) {
        tbody.innerHTML = `<tr><td colspan="9" class="text-center py-6 text-slate-500">Nessun veicolo trovato.</td></tr>`;
        return;
      }

      tbody.innerHTML = vehicles.map(row => {
        const desc = row.descrizione || "-";
        const isLongDesc = desc.length > 50;

        return `
          <tr class="hover:bg-slate-800/40 transition">
            <td class="py-2.5 px-3 sm:px-4 font-mono font-bold text-blue-400 whitespace-nowrap">#${row.id}</td>
            <td class="py-2 px-3 sm:px-4 min-w-[180px] max-w-[240px] sm:max-w-xs">
              <div class="expandable-cell text-slate-200 font-sans text-xs">
                <div class="expandable-text clamp-text font-medium leading-snug cursor-pointer select-text" onclick="toggleExpandText(this)">
                  ${desc}
                </div>
                ${isLongDesc ? `
                  <button type="button" onclick="toggleExpandText(this)" class="mt-1 inline-flex items-center gap-1 text-[11px] font-semibold text-blue-400 hover:text-blue-300 transition focus:outline-none">
                    <span class="toggle-label">Altro</span>
                    <i data-lucide="chevron-down" class="toggle-icon w-3 h-3 transition-transform"></i>
                  </button>
                ` : ''}
              </div>
            </td>
            <td class="py-2.5 px-3 sm:px-4 font-mono text-xs text-slate-400 whitespace-nowrap">${row.flag || "-"}</td>
            <td class="py-2.5 px-3 sm:px-4 whitespace-nowrap">${renderStatusPill(row.status_subito)}</td>
            <td class="py-2.5 px-3 sm:px-4 whitespace-nowrap text-slate-300 font-mono text-xs">${formatDate(row.data_p_subito)}</td>
            <td class="py-2.5 px-3 sm:px-4 whitespace-nowrap text-rose-300 font-mono text-xs">${formatDate(row.data_disattivazione_subito)}</td>
            <td class="py-2.5 px-3 sm:px-4 whitespace-nowrap">${renderStatusPill(row.status_autoscout)}</td>
            <td class="py-2.5 px-3 sm:px-4 whitespace-nowrap text-slate-300 font-mono text-xs">${formatDate(row.data_p_autoscout)}</td>
            <td class="py-2.5 px-3 sm:px-4 whitespace-nowrap text-rose-300 font-mono text-xs">${formatDate(row.data_disattivazione_autoscout)}</td>
          </tr>
        `;
      }).join("");

      lucide.createIcons();
    }

    // Event Listeners Navigazione
    document.getElementById("btn-view-logs").addEventListener("click", () => setView("logs"));
    document.getElementById("btn-view-vehicles").addEventListener("click", () => setView("vehicles"));

    // Event Listeners Filtri & Azioni
    document.getElementById("btn-refresh").addEventListener("click", fetchData);
    document.getElementById("filter-search").addEventListener("input", applyFilters);
    document.getElementById("btn-clear-date").addEventListener("click", () => {
      calendarPicker.clear();
      selectedCalendarDate = "";
      applyFilters();
    });
    document.getElementById("filter-level").addEventListener("change", applyFilters);
    document.getElementById("filter-mode").addEventListener("change", applyFilters);
    document.getElementById("filter-channel").addEventListener("change", applyFilters);
    document.getElementById("filter-limit").addEventListener("change", fetchData);

    document.querySelectorAll(".status-checkbox").forEach(cb => {
      cb.addEventListener("change", applyFilters);
    });

    document.getElementById("btn-check-all").addEventListener("click", () => {
      document.querySelectorAll(".status-checkbox").forEach(cb => cb.checked = true);
      applyFilters();
    });

    document.getElementById("btn-uncheck-all").addEventListener("click", () => {
      document.querySelectorAll(".status-checkbox").forEach(cb => cb.checked = false);
      applyFilters();
    });

    document.getElementById("btn-reset-default").addEventListener("click", () => {
      const defaults = ["EXPIRY_WARNING_1D", "EXPIRY_TRIGGER", "STATE_UPDATE_SUCCESS"];
      document.querySelectorAll(".status-checkbox").forEach(cb => {
        cb.checked = defaults.includes(cb.value);
      });
      applyFilters();
    });

    lucide.createIcons();
    fetchData();
  </script>
</body>
</html>
